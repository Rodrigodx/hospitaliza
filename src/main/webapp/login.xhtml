<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<meta charset="UTF-8" />
	<title>Hospitaliza</title>
	<h:outputStylesheet name="style.css" library="css" />
</h:head>

<h:body>

	<h:form prependId="false" styleClass="card-form">

		<div class="card-header">Login</div>

		<div class="section">

			<p:panelGrid columns="1" styleClass="ui-noborder">

				<p:outputLabel for="j_username" value="Login" />
				<p:inputText id="j_username" maxlength="80" />

			</p:panelGrid>

			<p:panelGrid columns="1" styleClass="ui-noborder">

				<p:outputLabel for="j_password" value="Senha" />
				<p:password id="j_password" maxlength="80" />

			</p:panelGrid>

			<p:commandButton value="Entrar" ajax="false" styleClass="btn"
				style="width:200px;margin-bottom:10px;" />

		</div>

	</h:form>

</h:body>
</html>
