<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<meta charset="UTF-8" />
	<title>Hospitaliza</title>
	<h:outputStylesheet name="style.css" library="css" />
</h:head>

<h:body>
	<h:form prependId="false" styleClass="card-form">

		<div class="card-header">Login</div>

		<div class="section">
			<p:messages id="messages" showDetail="false" closable="true">
				<p:autoUpdate />
			</p:messages>

			<p:panelGrid columns="1" styleClass="ui-noborder">
				<p:outputLabel for="username" value="Login" />
				<p:inputText id="username" value="#{loginBean.login}" maxlength="80"
					required="true" />
			</p:panelGrid>

			<p:panelGrid columns="1" styleClass="ui-noborder">
				<p:outputLabel for="password" value="Senha" />
				<p:password id="password" value="#{loginBean.senha}" maxlength="80"
					required="true" />
			</p:panelGrid>

			<p:commandButton value="Entrar"
				action="#{loginBean.authenticateUser}" ajax="false" styleClass="btn"
				style="width:200px;margin-bottom:10px;" />
		</div>

	</h:form>

</h:body>
</html>
